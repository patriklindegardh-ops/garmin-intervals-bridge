name: Generate Garmin Token

on:
  workflow_dispatch:

jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install garminconnect

      - name: Generate Session Token
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_MFA_CODE: ${{ secrets.GARMIN_MFA_CODE }}
        run: |
          python -c "
          import os, json, base64
          from garminconnect import Garmin

          email = os.environ['GARMIN_USERNAME']
          password = os.environ['GARMIN_PASSWORD']
          mfa = os.environ.get('GARMIN_MFA_CODE', '').strip()

          client = Garmin(email, password, prompt_mfa=lambda: mfa)
          client.login()

          token_dir = os.path.expanduser('~/.garminconnect')
          client.garth.dump(token_dir)

          import io, tarfile
          buf = io.BytesIO()
          with tarfile.open(fileobj=buf, mode='w:gz') as tar:
              tar.add(token_dir, arcname='.')
          
          token_b64 = base64.b64encode(buf.getvalue()).decode('utf-8')
          print('--- GARMIN TOKEN BELOW THIS LINE ---')
          print(token_b64)
          print('--- END OF GARMIN TOKEN ---')
          "
